<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loreforge — worldbuilding & campaign manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <a class="brand" href="#/">Lore<span>forge</span></a>
      <div id="world-name" class="world-name"></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button id="btn-search" class="ghost" title="Search (Ctrl+K)">🔍 Search <kbd>Ctrl K</kbd></button>
      </div>
    </aside>
    <main id="main"></main>
    <aside id="peek" class="hidden">
      <div class="peek-head">
        <span>Side panel</span>
        <button id="peek-close" class="icon" title="Close">✕</button>
      </div>
      <div id="peek-body"></div>
    </aside>
  </div>
  <div id="modal-root"></div>
  <div id="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
