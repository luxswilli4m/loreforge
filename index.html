<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loreforge — worldbuilding & campaign manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Uncial+Antiqua&family=Inter:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>" />
</head>
<body data-theme="tavern">
  <div id="backdrop"><div class="bd-img"></div><div class="bd-dim"></div><div class="bd-vignette"></div></div>
  <div id="app">
    <div class="paper-wrap" id="sidebar-wrap">
      <aside id="sidebar" class="paper">
        <a class="brand" href="#/">Lore<span>forge</span></a>
        <div id="world-name" class="world-name"></div>
        <nav id="nav"></nav>
        <div class="sidebar-foot">
          <button id="btn-search" class="ghost" title="Search (Ctrl+K)">🔍 Search <kbd>Ctrl K</kbd></button>
        </div>
      </aside>
    </div>
    <div class="paper-wrap" id="main-wrap">
      <div class="paper" id="main-paper"><main id="main"></main></div>
    </div>
    <div class="paper-wrap hidden" id="peek-wrap">
      <aside id="peek" class="paper">
        <div class="peek-head">
          <span>Side panel</span>
          <button id="peek-close" class="icon" title="Close">✕</button>
        </div>
        <div id="peek-body"></div>
      </aside>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
